# Load balancer uji (docker-compose.loadtest.scale.yml). Bukan konfigurasi produksi (produksi memakai Caddy).
worker_processes 1;
worker_rlimit_nofile 65536;
events { worker_connections 30000; }
http {
  access_log off;
  error_log /dev/stderr error;
  resolver 127.0.0.11 valid=2s ipv6=off; # DNS Docker: replika yang mati/hidup lagi langsung terlihat
  upstream api {
    zone api 64k;
    least_conn;
    server api:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 128;
  }
  server {
    listen 80 backlog=8192;
    keepalive_timeout 60s;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 20s;
      # Bawaan nginx: hanya permintaan yang belum terkirim, atau metode idempoten, yang dicoba ke replika lain.
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 3;
    }
  }
}
